<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order | AgroSense Dynamics</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<nav>

<div class="logo">
🌱 AgroSense <span>Dynamics</span>
</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="solutions.html">Solutions</a></li>
<li><a href="systems.html">Systems</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>

</nav>
</header>

<div class="page-title">

<h1>🛒 Order AgroSense</h1>

<p>
₹4,999 per system • Delivery to your mentioned address
</p>

</div>

<section>

<div class="container">

<div class="form-box">

<form
action="https://formsubmit.co/svdiitcomp3@gmail.com"
method="POST">

<input
type="hidden"
name="_subject"
value="New AgroSense Dynamics Order">

<input
type="hidden"
name="_captcha"
value="false">

<input
type="hidden"
name="_template"
value="table">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="Customer Name"
placeholder="Enter your full name"
required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="tel"
name="Phone Number"
placeholder="Enter phone number"
required>

</div>

<div class="form-group">

<label>Delivery Address</label>

<textarea
name="Delivery Address"
placeholder="Enter complete delivery address"
required></textarea>

</div>

<div class="form-group">

<label>Quantity</label>

<input
type="number"
id="quantity"
name="Quantity"
value="1"
min="1"
required
oninput="calculateTotal()">

</div>

<div class="total">

Total Amount

<span id="total">₹4,999</span>

<input
type="hidden"
id="totalHidden"
name="Total Amount"
value="₹4,999">

</div>

<div class="form-group">

<label>Payment Method</label>

<select name="Payment Method" required>

<option value="">
Select payment method
</option>

<option value="Cash on Delivery">
Cash on Delivery
</option>

<option value="UPI / GPay">
UPI / GPay
</option>

<option value="Card">
Card
</option>

</select>

</div>

<button
type="submit"
class="btn primary"
style="border:none;cursor:pointer;width:100%;">
Place Order
</button>

</form>

</div>

<div class="back">

<a href="index.html" class="btn secondary">
← Back to Home
</a>

</div>

</div>

</section>

<footer>
<p>© 2026 <strong>AgroSense Dynamics</strong></p>
</footer>

<script>

const PRICE = 4999;

function calculateTotal() {

let quantity =
parseInt(document.getElementById("quantity").value);

if (isNaN(quantity) || quantity < 1) {
quantity = 1;
}

let total = PRICE * quantity;

let formatted =
"₹" + total.toLocaleString("en-IN");

document.getElementById("total").innerText =
formatted;

document.getElementById("totalHidden").value =
formatted;

}

</script>

</body>
</html>
