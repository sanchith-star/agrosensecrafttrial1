<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback | AgroSense Dynamics</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<nav>

<div class="logo">
🌱 AgroSense <span>Dynamics</span>
</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="solutions.html">Solutions</a></li>
<li><a href="systems.html">Systems</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>

</nav>
</header>

<div class="page-title">

<h1>⭐ Feedback</h1>

<p>
Help us improve AgroSense Dynamics.
</p>

</div>

<section>

<div class="container">

<div class="form-box">

<form
action="https://formsubmit.co/svdiitcomp3@gmail.com"
method="POST">

<input
type="hidden"
name="_subject"
value="AgroSense Dynamics Feedback">

<input
type="hidden"
name="_captcha"
value="false">

<input
type="hidden"
name="_template"
value="table">

<div class="form-group">

<label>Name</label>

<input
type="text"
name="Name"
placeholder="Enter your name"
required>

</div>

<div class="form-group">

<label>Rating</label>

<select name="Rating" required>

<option value="">
Select rating
</option>

<option value="1 Star">⭐ 1 Star</option>
<option value="2 Stars">⭐⭐ 2 Stars</option>
<option value="3 Stars">⭐⭐⭐ 3 Stars</option>
<option value="4 Stars">⭐⭐⭐⭐ 4 Stars</option>
<option value="5 Stars">⭐⭐⭐⭐⭐ 5 Stars</option>

</select>

</div>

<div class="form-group">

<label>What did you like?</label>

<textarea
name="What They Liked"
placeholder="Tell us what you liked">
</textarea>

</div>

<div class="form-group">

<label>Suggestions / Improvements</label>

<textarea
name="Suggestions"
placeholder="Tell us how we can improve">
</textarea>

</div>

<button
type="submit"
class="btn primary"
style="border:none;cursor:pointer;width:100%;">
Submit Feedback
</button>

</form>

</div>

<div class="back">

<a href="index.html" class="btn secondary">
← Back to Home
</a>

</div>

</div>

</section>

<footer>
<p>© 2026 <strong>AgroSense Dynamics</strong></p>
</footer>

</body>
</html>
